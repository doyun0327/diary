<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://accounts.google.com" />
    <link id="diary-local-fonts" href="/fonts/diary-fonts.css" rel="stylesheet" />
    <title>PageBy</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* 크롬 등 브라우저에서 /join 초대 URL → 웹 SPA 입장 차단 */
      (function () {
        try {
          if (window.__DIARY_FLUTTER__ || window.DiaryNative) return;
          var u = new URL(location.href);
          var isJoin = u.pathname === '/join' || u.pathname.indexOf('/join/') === 0;
          if (!isJoin) return;
          var code = (u.searchParams.get('code') || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 8);
          if (code.length !== 8) {
            var parts = u.pathname.split('/').filter(Boolean);
            if (parts[0] === 'join' && parts[1]) {
              code = parts[1].replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 8);
            }
          }
          if (code.length !== 8) code = '';
          var store =
            'https://play.google.com/store/apps/details?id=com.yun.diary_app' +
            (code ? '?referrer=' + encodeURIComponent('invite_code=' + code) : '');
          var host = location.host;
          var path = 'join?code=' + encodeURIComponent(code);
          var intent =
            'intent://' + host + '/' + path +
            '#Intent;scheme=https;package=com.yun.diary_app;S.browser_fallback_url=' +
            encodeURIComponent(store) + ';end';
          document.documentElement.innerHTML =
            '<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>' +
            '<title>PageBy</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;' +
            'font-family:sans-serif;background:#fffdf7;color:#333;text-align:center;padding:24px}' +
            'a{display:inline-block;padding:12px 20px;border-radius:12px;background:#e8a838;color:#fff;' +
            'font-weight:700;text-decoration:none;margin-top:12px}.code{margin:12px 0;padding:8px 14px;' +
            'background:#f7efe0;border-radius:10px;font-weight:700;letter-spacing:.12em;display:inline-block}</style></head>' +
            '<body><div><h1>PageBy 앱에서 입장해 주세요</h1>' +
            '<p>초대 링크는 웹 브라우저로 들어갈 수 없어요.</p>' +
            (code ? '<div class="code">' + code + '</div>' : '') +
            '<p><a href="' + store + '">앱 열기 / 설치하기</a></p></div></body>';
          var ua = navigator.userAgent || '';
          if (/android/i.test(ua) && code) {
            location.replace(intent);
          } else if (/iphone|ipad|ipod/i.test(ua) && code) {
            location.href = 'pageby://' + path;
            setTimeout(function () { location.href = store; }, 1400);
          } else {
            setTimeout(function () { location.replace(store); }, 600);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
