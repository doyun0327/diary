# Cloudflare Workers — static SPA (Vite dist) + maintenance gate
name = "pageby-diary"
main = "worker/index.ts"
compatibility_date = "2025-07-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker가 MAINTENANCE 플래그를 먼저 본다
run_worker_first = true

[vars]
# 배포 중 안내: wrangler deploy --var MAINTENANCE:1
MAINTENANCE = "0"
